name: matching
on: [pull_request]

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run matching checks
        run: |
          if [ ! -f local/target.wasm ]; then
            echo "no local asset staged, skipping"
            exit 0
          fi
          python wasm/tools/split_functions.py local/target.wasm
          python tools/common/progress.py
